<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>

    <link rel="stylesheet" href="estilo.css">
</head>
<body>

    <main class="contenedor-principal">
        <div class="tarjeta-login">
            
            <div class="lado-izquierdo">
                <img src="img/png1.png" alt="Call of Duty" class="logo-cod">
                <img src="img/png22.png" alt="Minecraft" class="logo-mc">
                <img src="img/roblox.png" alt="roblox" class="logo-rb">
                

            </div>

            <div class="lado-derecho">
                <div class="cabecera-form">
                    <h2 class="titulo-login">Iniciar Sesión</h2>
                    <p class="subtitulo-login">Ingresa tus credenciales para continuar</p>
                </div>
                
               <form class="formulario-login" onsubmit="event.preventDefault(); window.location.href='Plataforma.html';">
                    <div class="grupo-campo">
                        <label for="correo">Correo Electrónico</label>
                        <div class="input-envoltorio">
                            <input type="email" id="correo" name="correo" placeholder="usuario@email.com" required autocomplete="email">
                        </div>
                    </div>

                    <div class="grupo-campo">
                        <div class="fila-etiqueta">
                            <label for="password">Contraseña</label>
                        </div>
                        <div class="input-envoltorio">
                            <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                        </div>
                        <a href="#" class="enlace-olvido">¿Olvidaste tu contraseña?</a>
                    </div>

                    <div class="grupo-checkbox">
                        <label class="custom-checkbox">
                            <input type="checkbox" name="captcha" required>
                            No soy un robot
                        </label>
                    </div>

                    <button type="submit" class="btn-entrar">Ingresar</button>
                </form>

                <div class="pie-login">
                    <p>¿No tienes una cuenta? <a href="#">Regístrate aquí</a></p>
                </div>
            </div>

        </div>
    </main>

</body>
</html>
